<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f0e7">
<title>大阪旅行｜電子票夾 V2</title>
<style>
:root{
 --cream:#f5f0e7; --paper:#fffdf8; --green:#173f35; --green2:#285d4e;
 --sage:#dfe8df; --gold:#b38a45; --gold2:#d7bc86; --ink:#292821;
 --muted:#756f64; --line:#e5ddcf; --danger:#a8453c; --shadow:0 12px 34px rgba(38,31,20,.08)
}
*{box-sizing:border-box} html{background:var(--cream)}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:
 radial-gradient(circle at 10% 0%,#fffaf0 0,transparent 30%),var(--cream)}
button,input{font:inherit} button{cursor:pointer;border:0}
.app{max-width:820px;margin:auto;min-height:100vh;padding:18px 16px 46px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand small{display:block;color:var(--gold);font-weight:800;letter-spacing:.18em;font-size:11px}
.brand h1{font-family:Georgia,"Noto Serif TC",serif;font-size:27px;margin:4px 0 0;color:var(--green)}
.sync{font-size:11px;color:var(--muted);white-space:nowrap}.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c8c1b5;margin-right:5px}.sync-dot.ok{background:#4c896d}
.hero{background:linear-gradient(135deg,var(--green),#214e43);color:white;border-radius:26px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #d7bc8660;border-radius:50%;right:-55px;top:-55px}
.eyebrow{font-size:12px;color:var(--gold2);font-weight:800;letter-spacing:.12em}
.hero h2{font-family:Georgia,"Noto Serif TC",serif;font-size:30px;margin:8px 0 4px}.hero p{margin:0;color:#e8eee9;font-size:14px}
.hero-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.hero-btn{background:#f8f2e7;color:var(--green);padding:12px 16px;border-radius:13px;font-weight:800}
.section-title{font-family:Georgia,"Noto Serif TC",serif;font-size:21px;margin:27px 2px 12px;color:var(--green)}
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.member{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:15px;text-align:left;box-shadow:0 5px 18px rgba(30,24,15,.04);transition:.15s}
.member:active{transform:scale(.985)}
.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--sage);border:4px solid #fff;box-shadow:0 3px 10px #00000010}
.member:nth-child(2) .avatar{background:#eadfce}.member:nth-child(3) .avatar{background:#e7dedb}.member:nth-child(4) .avatar{background:#dce5e8}.member:nth-child(5) .avatar{background:#e8e2d2}.member:nth-child(6) .avatar{background:#e0e4da}
.member-name{font-weight:900;font-size:18px;margin-top:12px;color:var(--green)}.member-count{font-size:13px;color:var(--muted);margin-top:3px}
.chevron{float:right;color:var(--gold);font-size:22px;margin-top:-22px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:17px;margin:12px 0;box-shadow:0 5px 20px rgba(30,24,15,.04)}
.back{background:transparent;color:var(--green);font-weight:800;padding:5px 0;margin:2px 0 12px}
.profile{display:flex;align-items:center;gap:14px}.profile .avatar{width:62px;height:62px}.profile h2{margin:0;font-size:23px;color:var(--green)}.profile p{margin:4px 0 0;color:var(--muted);font-size:13px}
.ticket{position:relative;overflow:hidden}.ticket:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--gold)}
.ticket-top{display:flex;justify-content:space-between;gap:10px}.ticket h3{margin:0;color:var(--green);font-size:19px}.ticket-date{color:var(--gold);font-weight:800;font-size:13px;white-space:nowrap}
.ticket-body{display:flex;gap:13px;margin-top:14px}.ticket-thumb{width:88px;height:88px;border-radius:14px;object-fit:cover;background:#eee7db}.ticket-note{font-size:13px;color:var(--muted);line-height:1.55}.ticket-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.primary,.secondary,.danger{padding:12px 15px;border-radius:13px;font-weight:800}.primary{background:var(--green);color:white}.secondary{background:#eee7dc;color:var(--green)}.danger{background:#f5ded9;color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:38px 15px}.add-zone{border:2px dashed #cdbb9a;border-radius:20px;background:#fbf7ef;text-align:center;padding:24px 16px;margin-top:14px}.add-zone .plus{font-size:31px;color:var(--gold)}.add-zone b{display:block;color:var(--green);font-size:18px;margin:6px 0}.add-zone span{font-size:13px;color:var(--muted)}
.all-grid{display:grid;gap:10px}
.modal{position:fixed;inset:0;background:#18231f99;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(820px,100%);max-height:94vh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:20px 17px 32px;box-shadow:0 -10px 40px #0003}.close{float:right;width:40px;height:40px;border-radius:50%;background:#e9e1d4;color:var(--green);font-weight:900}
.form{clear:both}.form h2{font-family:Georgia,"Noto Serif TC",serif;color:var(--green);font-size:25px;margin:7px 0 20px}.form label{display:block;font-weight:800;color:var(--green);font-size:14px;margin:14px 0 7px}.form input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:white;outline:none}.form input:focus{border-color:var(--gold)}.upload{border:2px dashed #cdbb9a;background:#fffaf1;border-radius:18px;padding:25px 14px;text-align:center;margin-top:7px}.upload input{display:none}.upload .upload-icon{font-size:34px}.upload b{display:block;color:var(--green);margin:5px}.preview{margin-top:12px;text-align:center}.preview img{max-width:100%;max-height:260px;border-radius:15px;object-fit:contain;background:white;padding:7px}.progress{height:7px;background:#e5ded2;border-radius:99px;margin-top:14px;display:none;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--gold)}
.qr-wrap{text-align:center}.qr-wrap .mini{font-size:12px;color:var(--muted)}.qr-wrap h2{font-family:Georgia,"Noto Serif TC",serif;color:var(--green);font-size:26px;margin:6px 0}.qr-frame{background:white;border-radius:20px;padding:14px;margin:17px auto;max-width:560px;box-shadow:0 7px 25px #0000000b}.qr-frame img{display:block;width:100%;max-height:63vh;object-fit:contain}.scan-tip{color:var(--muted);font-size:14px;margin:8px 0 16px}.footer-note{text-align:center;color:#9b9387;font-size:11px;margin-top:30px}
.member-edit{float:right;background:#eee7dc;color:var(--green);border-radius:11px;padding:7px 9px;font-weight:900;font-size:12px}.avatar-photo{width:100%;height:100%;border-radius:50%;object-fit:cover}.member-tools{display:flex;justify-content:flex-end;margin-top:-30px;position:relative;z-index:2}.avatar-upload{display:block;border:2px dashed #cdbb9a;background:#fffaf1;border-radius:18px;padding:20px;text-align:center}.avatar-upload input{display:none}.avatar-big{width:104px;height:104px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:#dfe8df;border:5px solid white;box-shadow:0 5px 18px #00000012;overflow:hidden}.avatar-big img{width:100%;height:100%;object-fit:cover}.edit-hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
@media(min-width:650px){.members{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><small>OSAKA TRAVEL 2026</small><h1>電子票夾</h1></div>
 <div class="sync"><span id="syncDot" class="sync-dot"></span><span id="syncText">準備中</span></div>
</header>

<main id="home">
 <section class="hero">
  <div class="eyebrow">10.06 — 10.17　·　6 位旅客</div>
  <h2>大阪旅行，票券都在這裡。</h2>
  <p>把每個人的 QR Code 放進專屬票夾，到了現場，打開就能出示。</p>
  <div class="hero-row"><button class="hero-btn" onclick="showAll()">🎫 查看全部票券</button><button class="hero-btn" onclick="openMembersEditor()">✏️ 編輯成員</button></div>
 </section>
 <div class="section-title">👥 選擇旅客</div>
 <div id="members" class="members"></div>
 <div class="footer-note">旅行票券會同步保存，換裝置也能查看。</div>
</main>

<main id="memberPage" style="display:none">
 <button class="back" onclick="goHome()">← 回旅客列表</button>
 <section id="profileCard" class="card"></section>
 <div id="ticketList"></div>
 <div class="add-zone" onclick="openAdd()"><div class="plus">＋</div><b>新增票券</b><span>從相簿上傳 QR Code 或票券圖片</span></div>
</main>

<main id="allPage" style="display:none">
 <button class="back" onclick="goHome()">← 回旅客列表</button>
 <section class="card"><div class="profile"><div class="avatar">🎫</div><div><h2>全部票券</h2><p>需要入場時，直接點「出示 QR Code」。</p></div></div></section>
 <div id="allList" class="all-grid"></div>
</main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://iqjcbtagaddofoxzemkm.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_ZDdkZ8OcYJe5EjAPyRbDKw_yTat3OC4";
const TRIP_CODE="osaka_2026_1006_1017", BUCKET="ticket-images";
const DEFAULT_MEMBERS=[
{id:"m1",name:"成員 1",avatar:"👩🏻‍🦰"},{id:"m2",name:"成員 2",avatar:"👨🏻‍🦱"},
{id:"m3",name:"成員 3",avatar:"👩🏻‍🦳"},{id:"m4",name:"成員 4",avatar:"👨🏻‍🦳"},
{id:"m5",name:"成員 5",avatar:"👩🏻"},{id:"m6",name:"成員 6",avatar:"👨🏻"}];
let MEMBERS=DEFAULT_MEMBERS.map(x=>({...x}));
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let tickets=[],currentMember=null;

function setSync(ok,t){document.querySelector("#syncDot").className="sync-dot"+(ok?" ok":"");document.querySelector("#syncText").textContent=t}
async function load(){
 setSync(false,"同步中…");
 const mr=await sb.from("osaka_trip_members").select("*").eq("trip_code",TRIP_CODE).order("sort_order",{ascending:true});
 if(!mr.error && mr.data?.length){ MEMBERS=mr.data.map(x=>({id:x.member_id,name:x.name||"未命名成員",avatar:x.avatar_url||x.avatar_emoji||"👤"})); localStorage.setItem("osaka_members",JSON.stringify(MEMBERS)); }
 else { const cached=JSON.parse(localStorage.getItem("osaka_members")||"null"); if(cached?.length===6) MEMBERS=cached; }
 const r=await sb.from("osaka_ticket_items").select("*").eq("trip_code",TRIP_CODE).order("created_at",{ascending:true});
 if(r.error){tickets=JSON.parse(localStorage.getItem("osaka_tickets")||"[]");setSync(false,"暫時離線");}
 else{tickets=r.data||[];localStorage.setItem("osaka_tickets",JSON.stringify(tickets));setSync(true,"已同步")}
 renderMembers();
}
function avatarHtml(m,cls="avatar"){return `<div class="${cls}">${m.avatar_url||m.avatar?.startsWith("data:")?`<img class="avatar-photo" src="${esc(m.avatar_url||m.avatar)}" alt="">`:esc(m.avatar||"👤")}</div>`}
function renderMembers(){
 document.querySelector("#members").innerHTML=MEMBERS.map(m=>{let n=tickets.filter(t=>t.member_id===m.id).length;return `<div class="member" role="button" tabindex="0" onclick="openMember('${m.id}')">${avatarHtml(m)}<div class="member-tools"><button class="member-edit" onclick="event.stopPropagation();openMemberEditor('${m.id}')">✏️ 編輯</button></div><div class="member-name">${esc(m.name)}</div><div class="member-count">🎫 ${n} 張票券</div><div class="chevron">›</div></div>`}).join("");
}
function openMember(id){
 currentMember=MEMBERS.find(x=>x.id===id);
 document.querySelector("#home").style.display="none";document.querySelector("#allPage").style.display="none";document.querySelector("#memberPage").style.display="block";
 document.querySelector("#profileCard").innerHTML=`<div class="profile">${avatarHtml(currentMember)}<div><h2>${esc(currentMember.name)}</h2><p>我的票券　·　${tickets.filter(t=>t.member_id===id).length} 張</p></div></div>`;
 renderMemberTickets();
}
function renderMemberTickets(){
 let list=tickets.filter(t=>t.member_id===currentMember.id);
 document.querySelector("#ticketList").innerHTML=list.length?list.map(ticketCard).join(""):`<div class="card empty">目前還沒有票券<br>從下面「新增票券」開始上傳。</div>`;
}
function ticketCard(t){
 return `<article class="card ticket"><div class="ticket-top"><h3>${esc(t.title||"未命名票券")}</h3><div class="ticket-date">${esc(t.use_date||"日期未填")}</div></div><div class="ticket-body"><img class="ticket-thumb" src="${esc(t.image_url)}"><div><div class="ticket-note">${esc(t.note||"QR Code 票券")}</div><div class="ticket-actions"><button class="primary" onclick='showQR(${JSON.stringify(t.id)})'>出示 QR Code</button><button class="secondary" onclick='openEdit(${JSON.stringify(t.id)})'>修改</button></div></div></div></article>`;
}
function showAll(){
 document.querySelector("#home").style.display="none";document.querySelector("#memberPage").style.display="none";document.querySelector("#allPage").style.display="block";
 document.querySelector("#allList").innerHTML=tickets.length?tickets.map(t=>`<div><div style="font-size:12px;color:#756f64;margin:5px 4px">${esc(MEMBERS.find(m=>m.id===t.member_id)?.name||"成員")}</div>${ticketCard(t)}</div>`).join(""):`<div class="card empty">目前還沒有票券。</div>`;
}
function goHome(){document.querySelector("#home").style.display="block";document.querySelector("#memberPage").style.display="none";document.querySelector("#allPage").style.display="none";renderMembers()}
function openMembersEditor(){
 document.querySelector("#modalContent").innerHTML=`<div class="form"><h2>編輯六位成員</h2><p class="edit-hint">每位成員都可以設定自己的姓名與頭像。修改後會同步到 Supabase，其他手機重新整理也會看到。</p>${MEMBERS.map(m=>`<div class="card" style="margin:12px 0;padding:14px"><div class="profile">${avatarHtml(m)}<div><h3 style="margin:0;color:var(--green)">${esc(m.name)}</h3><button class="secondary" style="margin-top:8px" onclick="openMemberEditor('${m.id}')">編輯這位成員</button></div></div></div>`).join("")}</div>`;
 document.querySelector("#modal").classList.add("show");
}
function openMemberEditor(id){
 const m=MEMBERS.find(x=>x.id===id); if(!m)return;
 document.querySelector("#modalContent").innerHTML=`<div class="form"><h2>編輯 ${esc(m.name)}</h2><div class="avatar-big" id="avatarPreview">${m.avatar_url||m.avatar?.startsWith("data:")?`<img src="${esc(m.avatar_url||m.avatar)}" alt="">`:esc(m.avatar||"👤")}</div><label>姓名</label><input id="memberName" value="${esc(m.name)}" placeholder="輸入這位旅客的姓名"><label>頭像</label><label class="avatar-upload" for="memberFile"><div style="font-size:28px">📷</div><b>上傳一張頭像照片</b><span>建議使用正方形照片，系統會自動裁成圓形</span><input id="memberFile" type="file" accept="image/*" onchange="previewMemberAvatar(event)"></label><div class="edit-hint">如果暫時不想上傳照片，也可以保留目前的插畫頭像。</div><button class="primary" style="width:100%;margin-top:18px" onclick="saveMember('${m.id}')">儲存成員資料</button></div>`;
 document.querySelector("#modal").classList.add("show");
}
function previewMemberAvatar(e){const f=e.target.files[0];if(!f)return;document.querySelector("#avatarPreview").innerHTML=`<img src="${URL.createObjectURL(f)}" alt="">`}
async function saveMember(id){
 const m=MEMBERS.find(x=>x.id===id); if(!m)return;
 const name=document.querySelector("#memberName").value.trim()||"未命名成員"; const file=document.querySelector("#memberFile").files[0]; let avatar_url=m.avatar_url||null;
 if(file){ if(file.size>5*1024*1024){alert("頭像圖片請使用 5MB 以下。" );return;} const ext=(file.name.split(".").pop()||"jpg").toLowerCase(); const path=`${TRIP_CODE}/members/${id}_${Date.now()}.${ext}`; const up=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type}); if(up.error){alert("頭像上傳失敗，請確認 Storage 設定。");return;} avatar_url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl; }
 const row={trip_code:TRIP_CODE,member_id:id,name,avatar_url,avatar_emoji:avatar_url?null:(m.avatar||"👤"),sort_order:MEMBERS.findIndex(x=>x.id===id)+1};
 const r=await sb.from("osaka_trip_members").upsert(row,{onConflict:"trip_code,member_id"}); if(r.error){alert("成員資料儲存失敗："+r.error.message);return;}
 m.name=name; m.avatar_url=avatar_url; if(!avatar_url)m.avatar=row.avatar_emoji; localStorage.setItem("osaka_members",JSON.stringify(MEMBERS)); closeModal(); renderMembers(); if(currentMember?.id===id)openMember(id); else openMembersEditor();
}
function openAdd(){openForm(null)} function openEdit(id){openForm(tickets.find(t=>t.id===id))}
function openForm(t){
 const edit=!!t;
 document.querySelector("#modalContent").innerHTML=`<div class="form"><h2>${edit?"修改票券":"新增一張票券"}</h2>
 <label>票券名稱</label><input id="fTitle" placeholder="例如：USJ、海遊館、景點門票" value="${esc(t?.title||"")}">
 <label>使用日期</label><input id="fDate" type="date" value="${t?.use_date||""}">
 <label>備註（可不填）</label><input id="fNote" placeholder="例如：10:00 入場" value="${esc(t?.note||"")}">
 <label>票券圖片</label>
 <label class="upload" for="fFile"><div class="upload-icon">🖼️</div><b>點這裡上傳票券圖片</b><span>可以選擇相簿裡的 QR Code 截圖</span><input id="fFile" type="file" accept="image/*" onchange="previewImage(event)"></label>
 <div id="preview" class="preview">${t?.image_url?`<img src="${esc(t.image_url)}">`:""}</div>
 <div id="uploadProgress" class="progress"><i></i></div>
 <button class="primary" style="width:100%;margin-top:18px" onclick="saveTicket('${t?.id||""}')">${edit?"儲存修改":"上傳並新增票券"}</button>
 ${edit?`<button class="danger" style="width:100%;margin-top:9px" onclick="deleteTicket('${t.id}')">刪除這張票券</button>`:""}
 <div class="small" style="margin-top:12px;color:#8b8377">圖片會同步保存，其他裝置開啟這趟旅行也能看到。</div></div>`;
 document.querySelector("#modal").classList.add("show");
}
function previewImage(e){const f=e.target.files[0];if(!f)return;document.querySelector("#preview").innerHTML=`<img src="${URL.createObjectURL(f)}">`}
async function saveTicket(id){
 const title=document.querySelector("#fTitle").value.trim()||"未命名票券",use_date=document.querySelector("#fDate").value||null,note=document.querySelector("#fNote").value.trim();
 const file=document.querySelector("#fFile").files[0];let old=tickets.find(t=>t.id===id),image_url=old?.image_url||"";
 if(file){
  if(file.size>8*1024*1024){alert("圖片太大，請選擇 8MB 以下的圖片。");return}
  document.querySelector("#uploadProgress").style.display="block";
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase(),path=`${TRIP_CODE}/${currentMember.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const up=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type});
  if(up.error){alert("圖片上傳失敗，請確認 Supabase Storage 已建立 ticket-images bucket。");return}
  image_url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;document.querySelector("#uploadProgress i").style.width="100%";
 }
 if(!image_url){alert("請先選擇票券圖片。");return}
 const row={trip_code:TRIP_CODE,member_id:currentMember.id,title,use_date,note,image_url};
 const r=id?await sb.from("osaka_ticket_items").update(row).eq("id",id):await sb.from("osaka_ticket_items").insert(row);
 if(r.error){alert("儲存失敗："+r.error.message);return}
 closeModal();await load();openMember(currentMember.id);
}
async function deleteTicket(id){if(!confirm("確定要刪除這張票券嗎？"))return;const r=await sb.from("osaka_ticket_items").delete().eq("id",id);if(r.error){alert("刪除失敗："+r.error.message);return}closeModal();await load();openMember(currentMember.id)}
function showQR(id){
 const t=tickets.find(x=>x.id===id);if(!t)return;
 document.querySelector("#modalContent").innerHTML=`<div class="qr-wrap"><div class="mini">${esc(t.use_date||"")}</div><h2>${esc(t.title||"票券")}</h2><div class="qr-frame"><img src="${esc(t.image_url)}" alt="票券 QR Code"></div><div class="scan-tip">請將這個畫面出示給工作人員掃描</div><button class="primary" style="width:100%" onclick="closeModal()">完成</button></div>`;
 document.querySelector("#modal").classList.add("show");
}
function closeModal(){document.querySelector("#modal").classList.remove("show")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
load();
</script>
</body>
</html>
